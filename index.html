    html {

    body {

      line-height: 1.6;
    }

    @keyframes fadeDown {

      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes subtleFloat {
      0% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0); }
    }

    .cover {
      width: 100%;

      background: linear-gradient(135deg, #0ea5e9, #1e3a8a);

      animation: fadeDown 0.8s ease-out;
    }

    .logo-circle {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 18px;
      animation: subtleFloat 3s ease-in-out infinite;
    }

    .logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cover h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .cover p {
      font-size: 16px;
      opacity: 0.9;
      margin-top: 8px;
    }

    header {
      position: sticky;
      top: 0;

      border-bottom: 1px solid #111827;
    }

      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 700;
      letter-spacing: 1px;
      font-size: 18px;
    }

    .logo span {
      color: #38bdf8;
    }

    nav a {
      margin-left: 16px;
      text-decoration: none;
      font-size: 14px;
      color: #9ca3af;
      position: relative;
      transition: color 0.2s ease;
    }

    nav a::after {

      position: absolute;

      bottom: -4px;
      width: 0;
      height: 2px;
      border-radius: 999px;
      background: #38bdf8;
      transition: width 0.2s ease;
    }

    nav a:hover {
      color: #e5e7eb;
    }

    nav a:hover::after {
      width: 100%;
    }

      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    section {
      margin-top: 40px;
      animation: fadeUp 0.7s ease-out;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1.5fr);

      align-items: center;
      margin-top: 24px;
    }

      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
